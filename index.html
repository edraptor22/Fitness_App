<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div id="titleWrap">
      <h1 id="title">Today</h1>
      <div id="subtitle"></div>
    </div>
    <button id="actionBtn" class="icon-btn" hidden></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar">
    <a href="#/today"    data-tab="today"    data-icon="today"><span>Today</span></a>
    <a href="#/goals"    data-tab="goals"    data-icon="target"><span>Goals</span></a>
    <a href="#/plans"    data-tab="plans"    data-icon="layers"><span>Plans</span></a>
    <a href="#/history"  data-tab="history"  data-icon="clock"><span>History</span></a>
    <a href="#/library"  data-tab="library"  data-icon="book"><span>Library</span></a>
    <a href="#/settings" data-tab="settings" data-icon="sliders"><span>More</span></a>
  </nav>
</div>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
