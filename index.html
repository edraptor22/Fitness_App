<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Back">&#8249;</button>
    <div id="titleWrap">
      <h1 id="title">Today</h1>
      <div id="subtitle"></div>
    </div>
    <button id="actionBtn" class="icon-btn" hidden></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar">
    <a href="#/today"    data-tab="today"><span class="ico">&#9679;</span><span>Today</span></a>
    <a href="#/plans"    data-tab="plans"><span class="ico">&#9635;</span><span>Plans</span></a>
    <a href="#/history"  data-tab="history"><span class="ico">&#9202;</span><span>History</span></a>
    <a href="#/library"  data-tab="library"><span class="ico">&#9776;</span><span>Library</span></a>
    <a href="#/settings" data-tab="settings"><span class="ico">&#9881;</span><span>Settings</span></a>
  </nav>
</div>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
